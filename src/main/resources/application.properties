# This is the configuration file for the Ontology Service.

# Enable/Disable indexing of ontologies on startup.
# Ontologies will not be indexed if they already exist, regardless of this setting.
# Might be useful for testing.
ontologyservice.startup.no-actions=false

# Ontology configurations
# Classpath resource names. No leading slash: the native executable's class
# loader does not strip one, so "/ontologies/..." would not be found there.
ontologyservice.ontologies."GO".local-file=ontologies/2023-11-22__go-basic.obo
ontologyservice.ontologies."TrOn".local-file=ontologies/tribolium.obo
# Native executables only contain the classpath resources listed here.
quarkus.native.resources.includes=ontologies/**

# Prefix for the Elasticsearch indices and aliases this service creates.
# Set ONTOLOGYSERVICE_ELASTICSEARCH_INDEX_PREFIX to isolate a deployment.
ontologyservice.elasticsearch.index-prefix=ontologyservice

# Quarkus configurations
%prod.quarkus.elasticsearch.hosts=es:9200
%dev.quarkus.elasticsearch.hosts=0.0.0.0:9200
%test.quarkus.elasticsearch.hosts=0.0.0.0:9200

quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.container-image.registry=docker.gitlab.gwdg.de
quarkus.container-image.group=MedBioinf/devbio/ibb
