# This is the configuration file for the Ontology Service.

# Some operations sent to Elasticsearh might not be immediately visible.
# This tells the service to wait for the index to be refreshed before returning.
# This is only useful for tests.
ontology-elasticsearch-impl.sync-after-reindex=false
%test.ontology-elasticsearch-impl.sync-after-reindex=true

# Enable/Disable indexing of ontologies on startup.
# Ontologies will not be indexed if they already exist, regardless of this setting.
# Might be useful for testing.
ontologyservice.startup.no-actions=false

# Ontology configurations
ontologyservice.ontologies."GO".local-file=/ontologies/2023-11-22__go-basic.obo
ontologyservice.ontologies."TrOn".local-file=/ontologies/tribolium.obo

# Quarkus configurations
%prod.quarkus.elasticsearch.hosts=es:9200
%dev.quarkus.elasticsearch.hosts=0.0.0.0:9200
quarkus.http.cors=true
quarkus.http.cors.origins=*

quarkus.elasticsearch.devservices.image-name=docker.elastic.co/elasticsearch/elasticsearch:8.11.1
quarkus.elasticsearch.devservices.distribution=elastic
